<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Registration Counter — RELAY 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "DM Sans", sans-serif;
    background: linear-gradient(135deg,#1C2B38,#2A3D4A);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 20px;
    overflow: hidden;
  }
  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 48px; }
  .header img { height: clamp(40px, 5vw, 64px); width: auto; object-fit: contain; flex-shrink: 0; }
  .header .title { font-family: "Bebas Neue", sans-serif; font-size: clamp(22px, 3.6vw, 42px); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; }
  /* Two independent stats side by side — registrant count and total
     participant count aren't a fraction of one another (unlike the old
     claimed/total food-pack ratio this page used to show), so this is
     two separate panels rather than one X/Y counter. */
  .stats-row { display: flex; gap: clamp(30px, 8vw, 100px); flex-wrap: wrap; justify-content: center; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat .num { font-family: "Bebas Neue", sans-serif; font-size: clamp(80px, 16vw, 220px); line-height: 1; letter-spacing: 0.02em; }
  .stat.registrants .num { color: #3A8BBF; }
  .stat.participants .num { color: #4BAE6A; }
  .stat .lbl { margin-top: 8px; font-size: clamp(13px, 1.6vw, 20px); letter-spacing: 0.12em; text-transform: uppercase; color: #6B8A9A; }
  /* Shown only when reg_gathering_closed is true, independent of why
     (manual switch, past the date cutoff, or the cap) — the user asked
     for this caption regardless of participant count. */
  .closed-caption {
    display: none;
    margin-top: 36px;
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(20px, 3vw, 34px);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #E8B830;
  }
  .err { position: fixed; bottom: 16px; font-size: 12px; color: #C0392B; }
</style>
</head>
<body>
  <div class="header">
    <img src="assets/images/admin-icon.jpg" alt="Logo" onerror="this.style.display='none'">
    <div class="title">Gathering Around the Gospel</div>
  </div>
  <div class="stats-row">
    <div class="stat registrants">
      <div class="num" id="registrantNum">–</div>
      <div class="lbl">📋 Registrants</div>
    </div>
    <div class="stat participants">
      <div class="num" id="participantNum">–</div>
      <div class="lbl">🧑‍🤝‍🧑 Total Participants</div>
    </div>
  </div>
  <div class="closed-caption" id="closedCaption">🎉 Registration is now closed!</div>
  <div class="err" id="errMsg"></div>

<script>
  // Tracks the two celebration conditions across polls so the 15s
  // confetti timer (separate from the 2s data-refresh timer) always
  // fires against the latest known state rather than re-fetching itself.
  let shouldCelebrate = false;

  function fireConfetti() {
    if (typeof confetti !== 'function') return;
    // A few staggered bursts from both sides reads better on a big venue
    // screen than one single center burst.
    const common = { particleCount: 90, spread: 70, ticks: 200 };
    confetti({ ...common, origin: { x: 0.2, y: 0.6 } });
    confetti({ ...common, origin: { x: 0.8, y: 0.6 } });
    setTimeout(() => confetti({ ...common, particleCount: 60, spread: 100, origin: { x: 0.5, y: 0.4 } }), 200);
  }

  async function refresh() {
    try {
      const [counterRes, settingsRes] = await Promise.all([
        fetch('/.netlify/functions/gathering-counter'),
        fetch('/.netlify/functions/site-settings'),
      ]);
      const counter  = await counterRes.json();
      const settings = await settingsRes.json();
      if (!counterRes.ok) throw new Error(counter.error || 'Failed to load');

      document.getElementById('registrantNum').textContent = counter.registrantCount;
      document.getElementById('participantNum').textContent = counter.totalParticipants;

      // Condition 1: reached the (live, admin-configurable) participant
      // cap — settingsRes already computes this the same way the
      // registration page's own closed-check does, so this stays correct
      // even if the cap is ever changed from its current 500.
      const isCapped = !!settings.gathering_capped;
      // Condition 2: registration closed for ANY reason (manual switch,
      // past GATHERING_REG_END, or capped) — shows the caption regardless
      // of participant count, per the request.
      const isClosed = !!settings.reg_gathering_closed;

      document.getElementById('closedCaption').style.display = isClosed ? 'block' : 'none';

      const wasCelebrating = shouldCelebrate;
      shouldCelebrate = isCapped || isClosed;
      // Fire the moment either condition FIRST becomes true — whether
      // that's on the very first load (page opened after the milestone
      // already happened) or mid-session (e.g. the 500th participant
      // registers while the screen is up) — not just on a page refresh.
      if (shouldCelebrate && !wasCelebrating) fireConfetti();

      document.getElementById('errMsg').textContent = '';
    } catch (e) {
      document.getElementById('errMsg').textContent = 'Connection issue — retrying…';
    }
  }

  refresh();
  setInterval(refresh, 2000);
  // Repeats independently of the 2s data poll — always checks the latest
  // shouldCelebrate flag set by refresh(), not a fresh fetch of its own.
  setInterval(() => { if (shouldCelebrate) fireConfetti(); }, 15000);
</script>
</body>
</html>
