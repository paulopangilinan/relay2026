<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Pack Counter — RELAY 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "DM Sans", sans-serif;
    background: linear-gradient(135deg,#1C2B38,#2A3D4A);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 20px;
  }
  .label { font-size: clamp(16px, 2.2vw, 28px); letter-spacing: 0.15em; text-transform: uppercase; color: #6B8A9A; margin-bottom: 24px; }
  .counter { font-family: "Bebas Neue", sans-serif; font-size: clamp(80px, 18vw, 260px); line-height: 1; letter-spacing: 0.02em; }
  .counter .claimed { color: #4BAE6A; }
  .counter .sep { color: #6B8A9A; margin: 0 clamp(10px, 2vw, 30px); }
  .counter .total { color: #fff; }
  .sub { margin-top: 20px; font-size: clamp(13px, 1.4vw, 18px); color: #6B8A9A; }
  .bar-wrap { width: min(80vw, 700px); height: 14px; background: rgba(255,255,255,0.1); border-radius: 8px; margin-top: 30px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#4BAE6A,#3A8BBF); border-radius: 8px; transition: width 0.6s ease; width: 0%; }
  .err { position: fixed; bottom: 16px; font-size: 12px; color: #C0392B; }
</style>
</head>
<body>
  <div class="label">🍱 Food Packs Distributed</div>
  <div class="counter">
    <span class="claimed" id="claimedNum">–</span><span class="sep">/</span><span class="total" id="totalNum">–</span>
  </div>
  <div class="sub" id="pctLabel"></div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="err" id="errMsg"></div>

<script>
  async function refresh() {
    try {
      const res = await fetch('/.netlify/functions/distro-counter');
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Failed to load');
      document.getElementById('claimedNum').textContent = json.claimedPacks;
      document.getElementById('totalNum').textContent = json.totalPacks;
      const pct = json.totalPacks > 0 ? Math.round((json.claimedPacks / json.totalPacks) * 100) : 0;
      document.getElementById('pctLabel').textContent = pct + '% distributed';
      document.getElementById('barFill').style.width = pct + '%';
      document.getElementById('errMsg').textContent = '';
    } catch (e) {
      document.getElementById('errMsg').textContent = 'Connection issue — retrying…';
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
